name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # pnpm comes from package.json "packageManager" (pnpm@12.11.2).
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exact dependency versions
        run: pnpm check:pins

      - name: No public (browser-exposed) env variables (AD-19)
        run: pnpm check:env

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Postgres only (no API, auth or storage containers). The CLI applies
      # supabase/roles.sql ("Seeding globals from roles.sql") and then every
      # migration in supabase/migrations.
      - name: Start local Supabase Postgres
        run: pnpm db:start

      # Generates role passwords into a fresh .env (gitignored) and applies
      # them; nothing is printed.
      - name: Role passwords
        run: pnpm db:roles

      - name: Database tests (grants, db:roles)
        run: pnpm test:db

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
