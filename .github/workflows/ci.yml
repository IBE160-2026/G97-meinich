name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # pnpm comes from package.json "packageManager" (pnpm@12.11.2).
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exact dependency versions
        run: pnpm check:pins

      - name: No public (browser-exposed) env variables (AD-19)
        run: pnpm check:env

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Postgres only (no API, auth or storage containers). The CLI applies
      # supabase/roles.sql ("Seeding globals from roles.sql") and then every
      # migration in supabase/migrations.
      - name: Start local Supabase Postgres
        run: pnpm db:start

      # Generates role passwords into a fresh .env (gitignored) and applies
      # them; nothing is printed.
      - name: Role passwords
        run: pnpm db:roles

      - name: Database tests (grants, db:roles)
        run: pnpm test:db

      # Batch step 1 (Python). uv is pinned here and in ingest/pyproject.toml
      # (tool.uv.required-version); Python 3.14 comes from
      # ingest/.python-version and the dependencies from ingest/uv.lock.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"

      - name: Step 1 dependencies
        run: uv sync --frozen
        working-directory: ingest

      # Fixture and contract tests: recorded responses, no network, writes
      # as ingest into the freshly migrated database (INGEST_DATABASE_URL
      # from the .env that db:roles wrote), always rolled back.
      - name: Step 1 tests
        run: pnpm test:ingest

      # The committed demo seed loads into the freshly migrated database as
      # `loader`, twice: the second run proves the load is idempotent
      # (AD-16). After the step-1 tests, because those assume empty register
      # tables.
      - name: Load the demo seed
        run: pnpm seed

      - name: Load the demo seed again
        run: pnpm seed

      # The export as reader reproduces the committed seed byte for byte.
      - name: Re-export the seed and compare
        run: pnpm seed:export && git diff --exit-code seed/

      # Proves the image builds. The real `pnpm ingest` is run by hand, never
      # in CI.
      - name: Step 1 image
        run: docker build --tag peerless-ingest:ci ingest

      # Smoke test: the installed package imports inside the image. No
      # database and no network are needed.
      - name: Step 1 image imports
        run: docker run --rm --entrypoint /app/.venv/bin/python peerless-ingest:ci -c "import peerless_ingest.run"

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
