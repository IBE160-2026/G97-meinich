<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peerless analyse, runde 2</title>
<style>
/* Fixed tokens (light):
   text #0B2340 · primary #1F3A5F · link #2F5D8C · signature #7399C6 (markers only, never text)
   surface #F5F7FA · divider #D9E0E8 · input border #7B8BA0 · slate #5B6B7F
   favourable #1F6F8B · unfavourable #B45309 · median tick #6B7C91
   Peer dots #7B8BA0 (3.5:1 on white). Chart gridlines #E6EBF1 (one step off surface). */
:root{--text:#0B2340;--primary:#1F3A5F;--link:#2F5D8C;--sig:#7399C6;--surface:#F5F7FA;--divider:#D9E0E8;--input:#7B8BA0;--slate:#5B6B7F;--fav:#1F6F8B;--unf:#B45309;--median:#6B7C91;--grid:#E6EBF1;--bg:#E9EDF2}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45}
a{color:var(--link);text-underline-offset:2px}
button{font:inherit;color:inherit}
.page{max-width:1700px;margin:0 auto;padding:24px 16px 64px}
.page>h1{font-size:22px;margin:0 0 6px}
.rvtext{max-width:900px;color:var(--slate);margin:4px 0}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.jump a{border:1px solid var(--input);border-radius:4px;padding:4px 10px;background:#fff;text-decoration:none;color:var(--text)}
.tabsec{margin-top:44px;border-top:2px solid var(--primary);padding-top:14px}
.tabsec>h2{margin:0 0 4px;font-size:19px}
.frames{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;margin-top:14px}
.fcol{max-width:100%;min-width:0}
.fwrap{max-width:100%;overflow-x:auto}
.flabel{font-size:12px;color:var(--slate);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.desk{width:1200px;background:#fff;border:1px solid #C9D2DC;border-radius:6px;box-shadow:0 1px 2px rgba(11,35,64,.06)}
.phone{width:395px;background:#fff;border:10px solid #1B2533;border-radius:28px;overflow:hidden}
.chrome{height:30px;background:#EEF1F5;border-bottom:1px solid var(--divider);border-radius:6px 6px 0 0;display:flex;align-items:center;padding:0 12px;gap:6px;font-size:12px;color:var(--slate)}
.chrome i{width:10px;height:10px;border-radius:50%;background:#C9D2DC;display:inline-block}
.chrome .url{margin-left:12px;background:#fff;border:1px solid var(--divider);border-radius:4px;padding:2px 10px}
.phurl{background:#EEF1F5;font-size:11.5px;color:var(--slate);text-align:center;padding:6px 0 5px;border-bottom:1px solid var(--divider)}
.rv{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);border:1px solid var(--divider);background:#fff;border-radius:3px;padding:1px 6px;margin:0 0 6px}

/* ---------- app ---------- */
.app{background:#fff;color:var(--text);width:100%;overflow:hidden}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--slate)} .small{font-size:12px}
.top{display:flex;align-items:center;gap:20px;padding:12px 32px;border-bottom:1px solid var(--divider)}
.ph .top{gap:10px;padding:10px 16px}
.brand{font-weight:700;font-size:17px;letter-spacing:.01em;color:var(--primary);text-decoration:none}
.org{display:flex;align-items:center;gap:6px}
.org input{font:inherit;font-size:13px;font-variant-numeric:tabular-nums;border:1px solid var(--input);border-radius:4px;padding:5px 8px;width:150px;color:var(--text);background:#fff}
.ph .org{flex:1;min-width:0}.ph .org input{width:100%}
.sr{position:absolute;left:-9999px}
.sp{flex:1}
.top a{white-space:nowrap}
.user{font-weight:500;white-space:nowrap}
.co{padding:22px 32px 0}
.ph .co{padding:16px 16px 0}
.co h1{font-size:24px;margin:0 0 4px;line-height:1.2}
.ph .co h1{font-size:21px}
.meta{display:flex;flex-wrap:wrap;gap:2px 0;color:var(--slate);font-size:13px}
.meta span:not(:last-child)::after{content:"·";margin:0 7px;color:var(--input)}
.tabs{display:flex;gap:2px;padding:0 32px;border-bottom:1px solid var(--divider);margin-top:16px}
.ph .tabs{padding:0 6px;overflow-x:auto;scrollbar-width:none;gap:0;align-items:stretch}
.ph .tab{white-space:normal;font-size:13px;padding:8px 6px;line-height:1.2;text-align:left}
.tab{background:none;border:0;color:var(--slate);padding:11px 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none}
.tab.on{color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--primary)}
.tab .req{font-size:11px;color:var(--slate);font-weight:400}
.ph .tab.locked{flex-direction:column;align-items:flex-start;gap:0;padding:7px 10px}
.ph .tab.locked .req{font-size:10.5px}
.lk{vertical-align:-1px;flex:none}
.main{padding:28px 32px 8px}
.ph .main{padding:18px 16px 4px}
.foot{font-size:11.5px;color:var(--slate);border-top:1px solid var(--divider);margin:28px 32px 0;padding:14px 0 18px}
.ph .foot{margin:24px 16px 0}
.foot .fl{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.foot p{margin:2px 0;max-width:110ch}
.scroll{overflow-x:auto;max-width:100%}

/* cards & grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.ph .grid{grid-template-columns:minmax(0,1fr);gap:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.ph .grid>*{grid-column:auto}
.card{border:1px solid var(--divider);border-radius:6px;padding:20px;background:#fff;min-width:0}
.ph .card{padding:16px}
.card h3{margin:0 0 2px;font-size:15px}
.kick{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);font-weight:600;margin:0 0 6px}
.hero .fig{font-size:15px;font-weight:600;margin:0 0 10px}
.hero .big{font-size:52px;font-weight:600;line-height:1.05;letter-spacing:-.01em}
.ph .hero .big{font-size:40px}
.hero .per{font-size:14px;color:var(--slate);margin:4px 0 16px}
.hero .vs{font-size:18px;margin:0}
.hero .ctx{color:var(--slate);margin:6px 0 16px}
.links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.sc .val{font-size:22px;font-weight:600;margin:6px 0 2px}
.sc .line{margin:0;color:var(--slate);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border:1px solid var(--input);border-radius:3px;padding:1px 6px;color:var(--text);white-space:nowrap}
.tag.soft{border-color:var(--divider);color:var(--slate)}
.dir-up{color:var(--fav);font-weight:600}
.dir-dn{color:var(--unf);font-weight:600}
.expl p.txt{margin:6px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.expl.open p.txt{display:block}
.expl .src{font-size:12px;color:var(--slate)}
.variant{margin-top:14px;border-top:1px solid var(--divider);padding-top:12px}
.variant p.txt{color:var(--slate)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--slate);margin:8px 0 6px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend b{color:var(--text);font-weight:600}
.plotwrap{position:relative}
.plotwrap svg{display:block}
svg text{font-family:inherit}
.ax{font-size:11px;fill:var(--slate);font-variant-numeric:tabular-nums}
.axl{font-size:11px;fill:var(--slate)}
svg[data-chart]{outline:none}
svg[data-chart]:focus-visible{outline:2px solid var(--link);outline-offset:2px}
table.lst{border-collapse:collapse;width:100%;font-size:13px}
.lst th,.lst td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--divider);vertical-align:top}
.lst thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600;border-bottom:1px solid var(--input)}
.lst td.r,.lst th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lst tr.ex td{color:#8593A5}
.lst tr.ex td.nm{text-decoration:line-through;text-decoration-color:#B5C0CC}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--unf);font-weight:600;white-space:nowrap}
.basis{white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:13px;white-space:nowrap}
.sparkgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:10px}
.ph .sparkgrid{grid-template-columns:minmax(0,1fr);gap:14px}
.spk .nm{font-size:13px;font-weight:600}
.spk .v{font-size:20px;font-weight:600;margin:2px 0}
.spk .v small{font-size:12px;color:var(--slate);font-weight:400}
.spk .gapnote{font-size:11.5px;color:var(--slate);margin-top:2px}
.ph .spk{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:center;border-bottom:1px solid var(--divider);padding-bottom:10px}
.ph .spk .gapnote{grid-column:1/-1}

/* funnel */
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:10px 0 6px;list-style:none;padding:0}
.funnel li{padding:0 14px 0 0;position:relative}
.funnel li+li{padding-left:14px;border-left:1px solid var(--divider)}
.funnel .st{font-size:12.5px;color:var(--slate);min-height:34px}
.funnel .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.funnel .bar{height:8px;background:var(--surface);border-radius:2px;margin-top:6px;position:relative}
.funnel .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:0 4px 4px 0}
.ph .funnel{grid-template-columns:minmax(0,1fr)}
.ph .funnel li{display:grid;grid-template-columns:1fr auto;align-items:center;padding:8px 0;border-left:0;border-bottom:1px solid var(--divider)}
.ph .funnel li+li{padding-left:0}
.ph .funnel .st{min-height:0;font-size:13px;color:var(--text)}
.ph .funnel .n{font-size:17px}
.ph .funnel .bar{grid-column:1/-1;height:6px;margin-top:4px}
.fsum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--input);border-radius:5px;overflow:hidden;max-width:100%}
.seg button{background:#fff;border:0;padding:7px 12px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--input)}
.seg button.on{background:var(--primary);color:#fff;font-weight:600}
.seg button[disabled]{color:#97A3B2;background:var(--surface);cursor:not-allowed}
.seg button small{display:block;font-size:10.5px;font-weight:400;opacity:.85}
.ph .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
.ph .seg button{padding:7px 4px;white-space:normal}
.ph .seg{gap:1px;background:var(--input)}
.ph .seg button+button{border-left:0}
.banner{border:1px solid var(--input);border-left:4px solid var(--primary);background:var(--surface);padding:10px 12px;border-radius:4px;font-size:13px;margin:10px 0}
.btn{background:var(--primary);color:#fff;border:0;border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn2{background:#fff;color:var(--primary);border:1px solid var(--primary);border-radius:4px;padding:7px 13px;cursor:pointer;font-weight:500}
.pcards{list-style:none;padding:0;margin:0}
.pcards li{border-bottom:1px solid var(--divider);padding:10px 0;font-size:13px}
.pcards .r1{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.pcards .r1 span{font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.pcards .why{color:var(--slate);margin:2px 0 4px}
.pcards .r3{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pcards li.ex{color:#8593A5}
.pcards li.ex .nm{text-decoration:line-through;text-decoration-color:#B5C0CC}

/* key figure table */
.topnote{font-size:13px;color:var(--slate);margin:0 0 10px}
table.kt{border-collapse:collapse;width:100%;font-size:13px}
.kt th,.kt td{padding:9px 8px;border-bottom:1px solid var(--divider);vertical-align:middle}
.kt thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600;border-bottom:1px solid var(--input);text-align:right;white-space:nowrap}
.kt thead th.l{text-align:left}
.kt td{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kt td.l,.kt th.nmc{text-align:left}
.kt th.nmc{font-weight:600;white-space:normal;min-width:190px}
.kt .sub2{display:block;font-size:11.5px;font-weight:400;color:var(--slate)}
.kt tr.grp td{background:var(--surface);font-size:11.5px;color:var(--slate);text-align:left;padding:5px 8px 5px 30px;white-space:normal}
.kt tr.sub th.nmc{padding-left:30px;font-weight:500;position:relative}
.kt tr.sub th.nmc::before{content:"";position:absolute;left:14px;top:0;bottom:0;border-left:2px solid var(--divider)}
.kt tr.sub .kr{font-weight:500;color:var(--primary)}
.kt tr.check th.nmc,.kt tr.check td{color:var(--slate);font-size:12.5px}
.kt .kr{font-weight:600}
.kt .kr small{display:block;font-weight:400;color:var(--slate);font-size:11px}
.kt td.floor{text-align:left;font-style:italic;white-space:normal}
.kt tr.fold td{background:#FBFCFD;text-align:left;white-space:normal;padding:0 8px 0 30px}
.fold-h{display:flex;align-items:center;gap:8px;padding:9px 0;font-weight:600;font-size:13px}
.fold-h .car{display:inline-block;width:10px;color:var(--slate)}
.fold-b{padding:0 0 14px 18px}
.dec{border-collapse:collapse;font-size:13px;margin:4px 0 8px}
.dec th,.dec td{padding:5px 12px 5px 0;border-bottom:1px solid var(--divider);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dec th:first-child,.dec td:first-child{text-align:left}
.dec thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600}
.dec tr.res td{font-weight:600;border-bottom:0}
.pend{outline:1px dashed var(--input);outline-offset:2px}
/* phone rows */
.prow{border-bottom:1px solid var(--divider)}
.prow .ph3{display:grid;grid-template-columns:minmax(0,1fr) 64px 112px;gap:8px;align-items:center;padding:10px 0;font-size:13px}
.prow .ph3 .n1{font-weight:600}
.prow .ph3 .n1 .car{color:var(--slate);display:inline-block;width:12px}
.prow .ph3 .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .ph3 .k{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:normal;font-size:12.5px}
.prow.sub .ph3{padding-left:14px}
.prow.sub .ph3 .n1{font-weight:500}
.pgrp{font-size:11.5px;color:var(--slate);background:var(--surface);padding:5px 8px;margin-top:4px}
.phhead{display:grid;grid-template-columns:minmax(0,1fr) 64px 112px;gap:8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600;border-bottom:1px solid var(--input);padding-bottom:6px}
.phhead span+span{text-align:right}
.pexp{padding:2px 0 14px 12px;font-size:13px}
.pexp dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0 0 10px}
.pexp dt{color:var(--slate)}.pexp dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.wall{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--divider);background:var(--surface);padding:16px;border-radius:6px}
.wall h3{margin:0 0 4px;font-size:15px}
.wall p{margin:0 0 10px}
.wall .lkbig{color:var(--slate);flex:none;margin-top:2px}
/* utvikling */
.ctlrow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:14px}
.ctlrow select{font:inherit;border:1px solid var(--input);border-radius:4px;padding:6px 8px;background:#fff;color:var(--text);max-width:100%}
.ph .ctlrow{flex-direction:column;align-items:stretch}
.ph .ctlrow .seg{grid-template-columns:repeat(2,minmax(0,1fr))}
.eng{display:flex;flex-wrap:wrap;gap:6px 24px;margin:6px 0 10px;font-size:14px}
.eng b{font-weight:600}
.note{font-size:12.5px;color:var(--slate);margin:6px 0 0}
.multi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.ph .multi{grid-template-columns:minmax(0,1fr)}
.mcell h4{margin:0;font-size:13px}
.mcell .sub2{font-size:11.5px;color:var(--slate)}
/* verdi */
.ctl{border:1px solid var(--divider);border-radius:6px;padding:18px 20px}
.ph .ctl{padding:14px}
.ctl .seg{margin-top:8px}
.ctl .seg button{min-width:72px}
.ph .ctl .seg{grid-template-columns:repeat(3,minmax(0,1fr))}
.ph .ctl .seg button{min-width:0}
.ctl .seg button + button[data-med]{}
.medline{font-size:12.5px;color:var(--slate);margin:8px 0 0;display:flex;align-items:center;gap:6px}
.mtick{display:inline-block;width:2px;height:12px;background:var(--median)}
.amts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
.ph .amts{grid-template-columns:minmax(0,1fr);gap:14px}
.amt .val{font-size:30px;font-weight:600;line-height:1.1;margin:6px 0 2px}
.ph .amt .val{font-size:26px}
.amt .val.na{font-size:15px;font-weight:500;line-height:1.35}
.amt .per{font-size:12.5px;color:var(--slate)}
.amt .mt{font-size:12px;color:var(--slate);margin-top:8px;display:flex;align-items:center;gap:6px}
.amt .sep{font-size:12px;color:var(--slate);margin-top:6px}
.trace{margin-top:12px;border-top:1px solid var(--divider);padding-top:10px;font-size:13px}
.trace ol{margin:6px 0 0;padding-left:20px}
.trace li{margin:0 0 8px}
.trace .calc{font-variant-numeric:tabular-nums;background:var(--surface);padding:6px 8px;border-radius:4px;display:inline-block;margin-top:3px;white-space:normal}
.trace code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--slate)}
.evrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
.ph .evrow{grid-template-columns:minmax(0,1fr);gap:14px}
.evf{display:flex;align-items:center;gap:8px;margin:8px 0}
.evf input{width:90px;font:inherit;border:1px solid var(--input);border-radius:4px;padding:6px 8px;font-variant-numeric:tabular-nums}
.below{margin-top:20px}
/* tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;background:#fff;border:1px solid var(--divider);box-shadow:0 2px 8px rgba(11,35,64,.14);border-radius:5px;padding:7px 9px;font-size:12px;line-height:1.35;min-width:120px;display:none;color:var(--text)}
.tip.static{position:absolute;display:block}
.tip .tv{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.tip .ts{color:var(--slate)}
.tip .th{color:var(--slate);font-size:11px;margin-bottom:3px}
.tip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .tr i{display:inline-block;width:12px;height:0;border-top:2px solid var(--primary)}
.tip .tr i.d{border-top:2px dashed var(--median)}
.tip .tr i.b{border-top:6px solid rgba(107,124,145,.25)}
.tip.static::after{content:"";position:absolute;left:var(--ax,50%);bottom:-6px;width:10px;height:10px;background:#fff;border-right:1px solid var(--divider);border-bottom:1px solid var(--divider);transform:translateX(-50%) rotate(45deg)}
</style>
</head>
<body>
<div class="page" id="root"></div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
/*MSG-START*/
const messages = {
  "review.title": "Analysesiden, runde 2",
  "review.intro": "Revised analysis page after round 1. Every tab at desktop (1200 px) and phone (375 px). Fjordkode AS and all peers are invented; peer names were not checked against the register. Tokens, markers and number formats are as decided. Better-to-the-right mirroring and the beste-fjerdedel triangle are still provisional. Hover any dot or line for a tooltip; tabs inside the frames are static except where noted.",
  "review.jump": "Jump to",
  "review.desk": "Desktop · 1200 px",
  "review.phone": "Phone · 375 px",
  "review.anon": "anonymous",
  "review.signedIn": "signed in (owner)",
  "review.ov.note": "Card grid: hero, explanation, three small cards, two peer-plot variants to pick from, compact peer list, sparklines with a faint peer-median line (decided: open to everyone). On the phone the beeswarm shows one tooltip drawn open.",

const mill=v=>t('unit.mill',{v:N1.format(v)});
const pp=v=>t('unit.pp',{v:N1.format(v)}).replace(' ',NB);
const days=v=>t('unit.days',{v:N0.format(v)}).replace(' ',NB);
function fv(v,u){if(v===null||v===undefined)return '–';return u==='%'?pct(v):u==='d'?days(v):N2.format(v);}
const LOCK=(s=11)=>`<svg class="lk" width="${s}" height="${s+1}" viewBox="0 0 11 12" aria-hidden="true"><rect x="1" y="5" width="9" height="7" rx="1.5" fill="currentColor"/><path d="M3 5V3.6a2.5 2.5 0 015 0V5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
const REG={}; let UID=0; const uid=p=>p+(++UID);

/* ---------------- chart primitives ---------------- */
/* Company marker: signature fill, navy-900 outline, 2px surface ring. */
function ownDot(x,y,r=6){return `<circle cx="${x}" cy="${y}" r="${r+2}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${r}" fill="#7399C6" stroke="#0B2340" stroke-width="2"/>`;}
function medTick(x,y1,y2){return `<line x1="${x}" x2="${x}" y1="${y1}" y2="${y2}" stroke="#6B7C91" stroke-width="2"/>`;}
function bestTri(x,y){return `<path d="M${x-5} ${y-8}h10l-5 8z" fill="#fff" stroke="#5B6B7F" stroke-width="1.5" stroke-linejoin="round"/>`;}

/* Peer plot: strip or beeswarm of driftsmargin. */
function peerPlot(mode,W,staticTipIdx){
  const id=uid('pp'); const dom=[-20,26]; const L=14,R=14;
  const x=v=>L+(v-dom[0])/(dom[1]-dom[0])*(W-L-R);
  const r=4.5, own={v:2.1};
  let pts=PEERS.map(p=>({p,x:x(p.dm),dy:0}));
  let H, cy;
  if(mode==='swarm'){
    const placed=[{x:x(own.v),dy:0,r:6}];
    const order=[...pts].sort((a,b)=>Math.abs(a.x-x(own.v))-Math.abs(b.x-x(own.v)));
    for(const q of order){
      for(let k=0;k<40;k++){
        const dy=(k===0?0:(k%2?1:-1)*Math.ceil(k/2)*5.5);
        if(placed.every(o=>Math.hypot(o.x-q.x,o.dy-dy)>=(o.r||r)+r+2)){q.dy=dy;placed.push({x:q.x,dy,r});break;}
      }
    }
    const span=Math.max(...pts.map(q=>Math.abs(q.dy)))+10;
    cy=22+span; H=cy+span+34;
  } else { cy=40; H=94; }
  const axY=H-26;
  let s=`<svg data-chart="${id}" tabindex="0" role="img" aria-label="${esc(t('ov.plot.title'))}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for(const tv of [-20,-10,0,10,20]){s+=`<line x1="${x(tv)}" x2="${x(tv)}" y1="14" y2="${axY}" stroke="#E6EBF1"/><text class="ax" x="${x(tv)}" y="${axY+16}" text-anchor="middle">${esc(pct(tv,0))}</text>`;}
  s+=`<line x1="${L}" x2="${W-R}" y1="${axY}" y2="${axY}" stroke="#D9E0E8"/>`;
  s+=`<text class="axl" x="${W-R}" y="10" text-anchor="end">${esc(t('better'))}</text>`;
  const top=mode==='swarm'?16:cy-16, bot=axY;
  s+=medTick(x(-3.2),top,bot);
  s+=bestTri(x(9.1),axY);
  for(const q of pts){s+=`<circle cx="${q.x.toFixed(1)}" cy="${(cy+q.dy).toFixed(1)}" r="${r}" fill="#7B8BA0" stroke="#fff" stroke-width="1.5"/>`;}
  s+=ownDot(x(own.v),cy);
  s+=`<text x="${x(own.v)}" y="${mode==='swarm'?cy-12:cy-14}" text-anchor="middle" style="font-size:11.5px;font-weight:600;fill:#0B2340;paint-order:stroke;stroke:#fff;stroke-width:3px">${esc(t('legend.own'))}</text>`;
  s+='</svg>';
  REG[id]={kind:'p',pts:[...pts.map(q=>({x:q.x,y:cy+q.dy,v:pct(q.p.dm),n:q.p.name,e:mill(q.p.rev)})),{x:x(own.v),y:cy,v:pct(2.1),n:D.name,e:mill(16.7)},{x:x(-3.2),y:axY-6,v:pct(-3.2),n:t('legend.median')},{x:x(9.1),y:axY-4,v:pct(9.1),n:t('legend.best')}]};
  let tip='';
  if(staticTipIdx!=null){
    const q=pts[staticTipIdx]; const tw=170; const ty=cy+q.dy;
    let left=Math.min(Math.max(q.x-tw/2,0),W-tw);
    tip=`<div class="tip static" style="left:${left}px;bottom:${H-ty+12}px;width:${tw}px;--ax:${q.x-left}px"><div class="tv">${esc(pct(q.p.dm))}</div><div>${esc(q.p.name)}</div><div class="ts">${esc(t('ov.list.rev'))} ${esc(mill(q.p.rev))}</div></div>`;
  }
  const leg=`<div class="legend"><span><svg width="16" height="16">${ownDot(8,8,5)}</svg>${esc(t('legend.own'))} <b>${esc(pct(2.1))}</b></span><span><svg width="6" height="14"><line x1="3" x2="3" y1="0" y2="14" stroke="#6B7C91" stroke-width="2"/></svg>${esc(t('legend.median'))} <b>${esc(pct(-3.2))}</b></span><span><svg width="12" height="10">${bestTri(6,9)}</svg>${esc(t('legend.best'))} <b>${esc(pct(9.1))}</b></span><span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="#7B8BA0"/></svg>${esc(t('legend.peers',{n:23}))}</span></div>`;
  return `${leg}<div class="scroll"><div class="plotwrap" style="width:${W}px;${tip?'padding-top:58px':''}">${s}${tip}</div></div>`;
}

/* Distribution strip for the table (summary marks). Lower-is-better is mirrored so better is right. */
function distStrip(key,W=190){
  const d=DIST[key], f=F[key], id=uid('ds'); const H=30,L=8,R=8,y=17;
  const mir=f.dir==='down';
  const x=v=>L+((mir?d.dom[1]-v:v-d.dom[0])/(d.dom[1]-d.dom[0]))*(W-L-R);
  const own=f.own[4];
  let s=`<svg data-chart="${id}" tabindex="0" role="img" aria-label="${esc(t(f.k))}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#D9E0E8"/>`;
  const a=x(d.q1),b=x(d.q3); s+=`<rect x="${Math.min(a,b)}" y="${y-3}" width="${Math.abs(b-a)}" height="6" rx="2" fill="#D9E0E8"/>`;
  s+=medTick(x(d.med),y-8,y+8);
  const pts=[{x:x(own),y,v:fv(own,f.u),n:D.name},{x:x(d.med),y,v:fv(d.med,f.u),n:t('legend.median')},{x:Math.min(a,b),y,v:fv(mir?d.q3:d.q1,f.u)+' – '+fv(mir?d.q1:d.q3,f.u),n:t('legend.mid')}];
  if(d.best!=null){s+=bestTri(x(d.best),y-6);pts.push({x:x(d.best),y:y-8,v:fv(d.best,f.u),n:t('legend.best')});}
  s+=ownDot(x(own),y,5);
  s+='</svg>';
  REG[id]={kind:'p',pts};
  return s;
}

/* Sparkline: own 2021–2025 (2px, broken where null) + faint peer-median reference line. No band, no placement, no 2026. */
function spark(key,W=120,H=30){
  const f=F[key], id=uid('sp'); const L=4,R=6,T=5,B=5;
  const vals=[...f.own,...(f.med||[])].filter(v=>v!=null);
  let lo=Math.min(...vals),hi=Math.max(...vals); const pad=(hi-lo)*0.12||1; lo-=pad;hi+=pad;
  const x=i=>L+i*(W-L-R)/4, y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let s=`<svg data-chart="${id}" tabindex="0" role="img" aria-label="${esc(t(f.k))} 2021–2025" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  if(f.med) s+=`<polyline points="${f.med.map((v,i)=>x(i)+','+y(v).toFixed(1)).join(' ')}" fill="none" stroke="#6B7C91" stroke-width="1" stroke-opacity=".55"/>`;
  s+=segPaths(f.own,x,y,'#1F3A5F',2);
  /* isolated single points (neighbours null) get a small dot so they are not lost */
  f.own.forEach((v,i)=>{if(v!=null&&(i===4||(f.own[i-1]==null&&f.own[i+1]==null)))s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===4?3.5:2.5}" fill="${i===4?'#7399C6':'#1F3A5F'}" ${i===4?'stroke="#0B2340" stroke-width="1.5"':''}/>`;});
  s+=`<line class="xh" x1="0" x2="0" y1="0" y2="${H}" stroke="#7B8BA0" stroke-width="1" visibility="hidden"/>`;
  s+='</svg>';
  REG[id]={kind:'x',xs:YEARS.map((_,i)=>x(i)),rows:YEARS.map((yr,i)=>({h:String(yr),r:[[ 'o', f.own[i]==null?t('spark.missing'):fv(f.own[i],f.u), D.name ], ...(f.med?[[ 'd', fv(f.med[i],f.u), t('spark.median') ]]:[])]}))};
  return s;
}
function segPaths(arr,x,y,col,w,dash){
  let s='',seg=[];
  const flush=()=>{if(seg.length>1)s+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/>`;seg=[];};
  arr.forEach((v,i)=>{if(v==null)flush();else seg.push(x(i).toFixed(1)+','+y(v).toFixed(1));});flush();return s;
}
function niceTicks(lo,hi,n){const raw=(hi-lo)/n;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const st=[1,2,2.5,5,10].map(m=>m*mag).find(m=>m>=raw);const out=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)out.push(+v.toFixed(6));return out;}

/* Utvikling line chart: own solid, median dashed, shaded band (median↔beste fjerdedel, or midtre halvdel), hollow 2026 own-figure point. */
function lineChart(key,W,H,compact){
  const f=F[key], id=uid('lc');
  const L=compact?34:44, R=compact?(f.o26!=null?46:10):(f.o26!=null?92:16), T=compact?8:14, B=24;
  const n26=f.o26!=null;
  const plotR=W-R;
  const x=i=>L+i*(plotR-L-(n26?0:0))/4;
  const x26=plotR+(compact?26:40);
  const bandA=f.best||f.q1, bandB=f.best?f.med:f.q3;
  const vals=[...f.own,...(f.med||[]),...(bandA||[]),...(bandB||[]),...(n26?[f.o26]:[])].filter(v=>v!=null);
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*0.1||1;lo-=pad;hi+=pad;
  const ticks=niceTicks(lo,hi,compact?3:4); lo=Math.min(lo,ticks[0]); hi=Math.max(hi,ticks[ticks.length-1]);
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let s=`<svg data-chart="${id}" tabindex="0" role="img" aria-label="${esc(t(f.k))} 2021–2025" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for(const tv of ticks){s+=`<line x1="${L}" x2="${plotR}" y1="${y(tv)}" y2="${y(tv)}" stroke="#E6EBF1"/><text class="ax" x="${L-6}" y="${y(tv)+4}" text-anchor="end">${esc(f.u==='%'?nf(0).format(tv)+(compact?'':NB+'%'):f.u==='x'?N1.format(tv):N0.format(tv))}</text>`;}
  if(bandA&&bandB){const up=bandA.map((v,i)=>x(i)+','+y(v).toFixed(1)).join(' ');const dn=bandB.map((v,i)=>x(i)+','+y(v).toFixed(1)).reverse().join(' ');s+=`<polygon points="${up} ${dn}" fill="#6B7C91" fill-opacity=".13"/>`;}
  if(f.med)s+=segPaths(f.med,x,y,'#6B7C91',1.5,'5 4');
  s+=segPaths(f.own,x,y,'#1F3A5F',2);
  f.own.forEach((v,i)=>{if(v!=null)s+=ownDot(x(i),y(v),i===4?5:3.5);});
  YEARS.forEach((yr,i)=>{s+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${compact?"'"+String(yr).slice(2):yr}</text>`;});
  /* 2022 break marker */
  const miss=f.own.map((v,i)=>v==null?i:-1).filter(i=>i>=0);
  for(const i of miss){s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B}" stroke="#D9E0E8" stroke-width="1"/>`;if(!compact)s+=`<text class="axl" x="${x(i)}" y="${T+10}" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:3px">${esc(t('ut.notRead'))}</text>`;}
  if(n26){
    s+=`<line x1="${plotR+(compact?10:14)}" x2="${plotR+(compact?10:14)}" y1="${T}" y2="${H-B}" stroke="#D9E0E8"/>`;
    s+=`<circle cx="${x26}" cy="${y(f.o26)}" r="${compact?4:5}" fill="#fff" stroke="#0B2340" stroke-width="2"/>`;
    s+=`<text class="ax" x="${x26}" y="${H-6}" text-anchor="middle">${esc(t('ut.y2026'))}</text>`;
    if(!compact){s+=`<text class="axl" x="${x26}" y="${y(f.o26)-22}" text-anchor="middle">${esc(t('ut.unfiled1'))}</text><text class="axl" x="${x26}" y="${y(f.o26)-10}" text-anchor="middle">${esc(t('ut.unfiled2'))}</text>`;}
  }
  s+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#7B8BA0" stroke-width="1" visibility="hidden"/>`;
  s+='</svg>';
  const xs=YEARS.map((_,i)=>x(i)); const rows=YEARS.map((yr,i)=>{const r=[['o',f.own[i]==null?t('spark.missing'):fv(f.own[i],f.u),D.name]];if(f.med)r.push(['d',fv(f.med[i],f.u),t('legend.median')]);if(f.best)r.push(['b',fv(f.best[i],f.u),t('legend.best')]);else if(f.q1)r.push(['b',fv(f.q1[i],f.u)+' – '+fv(f.q3[i],f.u),t('legend.mid')]);return {h:String(yr),r};});
  if(n26){xs.push(x26);rows.push({h:'2026 · '+t('legend.unfiled'),r:[['o',fv(f.o26,f.u),D.name]]});}
  REG[id]={kind:'x',xs,rows};
  return s;
}

  </div>`;
  const ev=(filled)=>`<div class="card"><span class="rv">${esc(t(filled?'review.ve.evFilled':'review.ve.evEmpty'))}</span><p class="kick">${esc(t('ve.ev.title'))}</p><div class="evf"><label class="sr">${esc(t('ve.ev.label'))}</label><input data-ev inputmode="decimal" aria-label="${esc(t('ve.ev.label'))}" value="${filled?'6':''}"></div><div data-evout>${filled?evOut(a.profit,6):`<p class="small muted" style="margin:0">${esc(t('ve.ev.empty'))}</p>`}</div></div>`;
  const below=`<div class="card below"><span class="rv">${esc(t('review.ve.below'))}</span><p class="small muted" style="margin:0 0 4px">${esc(t('ve.belowName',{own:pct(1.0),med:pct(4.0),best:pct(8.1)}))}</p><h3 style="font-size:14px;margin:6px 0 0">${esc(t('ve.ctl.title'))}</h3><div class="scroll">${stepSeg(42,42,false)}</div><p class="medline"><span class="mtick"></span>${esc(t('ve.belowMed',{v:42}))} · ${esc(t('ve.medianBasis'))}</p></div>`;
  return `<div data-ve><div class="ctl"><h3>${esc(t('ve.ctl.title'))}</h3><p class="small muted" style="margin:0">${esc(t('ve.ctl.sub'))}</p><div class="scroll">${stepSeg(share,0,true)}</div><p class="medline"><span class="mtick"></span>${esc(t('ve.aboveMedian'))} · ${esc(t('ve.medianBasis'))}</p></div>${amt}<div class="evrow" data-evrow>${ev(false)}${ev(true)}</div>${below}</div>`;
}
function evOut(profit,m){const tenths=Math.round(m*10);const v=Math.round(profit*tenths/10);return `<div class="amt"><div class="val">${esc(kr(v))}</div><div class="per">${esc(t('ve.ev.result'))}: ${esc(t('ve.ev.calc',{p:kr(profit),m:N1.format(tenths/10).replace(',0',''),v:kr(v)}))}</div><div class="per">${esc(t('ve.ev.note'))}</div></div>`;}

/* ---------------- page ---------------- */
function sec(id,titleKey,noteKey,content){return `<section class="tabsec" id="${id}"><h2>${esc(t(titleKey))}</h2><p class="rvtext">${esc(t(noteKey))}</p>${content}</section>`;}
const root=document.getElementById('root');
root.innerHTML=`<h1>${esc(t('review.title'))}</h1><p class="rvtext">${esc(t('review.intro'))}</p><nav class="jump"><span class="muted" style="align-self:center">${esc(t('review.jump'))}</span>${TABS.map(([k,m])=>`<a href="#s-${k}">${esc(t(m))}</a>`).join('')}</nav>`
 + sec('s-ov','tabs.oversikt','review.ov.note',pair('ov',oversikt))
 + sec('s-pe','tabs.peers','review.pe.note',pair('pe',peers)+`<h3 style="margin:28px 0 0">${esc(t('review.pe.widened'))}</h3>`+pair('pe',peersWidened))
 + sec('s-gap','tabs.gap','review.gap.note',`<div class="frames">${frame(false,'gap',gapDesk(true),{signed:true,state:t('review.signedIn')})}${frame(true,'gap',gapPhone(false),{state:t('review.anon')})}</div>`)
 + sec('s-ut','tabs.utvikling','review.ut.note',
     `<h3 style="margin:16px 0 0">${esc(t('review.ut.wall'))}</h3>`+pair('ut',()=>wall())
     +`<h3 style="margin:28px 0 0">${esc(t('review.ut.single'))}</h3><div class="frames">${frame(false,'ut',utSigned(false,'one','dm'),{signed:true})}${frame(true,'ut',utSigned(true,'one','lonn'),{signed:true})}</div>`
     +`<h3 style="margin:28px 0 0">${esc(t('review.ut.multi'))}</h3><div class="frames">${frame(false,'ut',utSigned(false,'all','dm'),{signed:true})}${frame(true,'ut',utSigned(true,'all','dm'),{signed:true})}</div>`)
 + sec('s-ve','tabs.verdi','review.ve.note',pair('ve',verdi));

/* ---------------- interactivity ---------------- */
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-ut-mode]');
  if(m){const w=m.closest('[data-ut]');w.outerHTML=utSigned(w.dataset.p==='1',m.dataset.utMode,w.dataset.key);return;}
  const sb=e.target.closest('[data-ve] [data-share]');
  if(sb&&!sb.disabled&&sb.closest('.ctl')){const ve=sb.closest('[data-ve]');const s=+sb.dataset.share;sb.parentNode.querySelectorAll('button').forEach(b=>{const on=b===sb;b.classList.toggle('on',on);b.setAttribute('aria-checked',on);});const a=amounts(s);ve.querySelector('[data-a=profit]').textContent=kr(a.profit);ve.querySelector('[data-a=profitPer]').textContent=t('ve.amt.at',{v:s});ve.querySelector('[data-a=op]').textContent=kr(a.op);ve.querySelector('[data-a=opPer]').textContent=t('ve.amt.atOnce',{v:s});ve.querySelectorAll('[data-ev]').forEach(i=>i.dispatchEvent(new Event('input',{bubbles:true})));ve.dataset.share=s;return;}
  if(e.target.closest('a[href="#"]'))e.preventDefault();
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-ut-select]');if(s){const w=s.closest('[data-ut]');w.outerHTML=utSigned(w.dataset.p==='1','one',s.value);}});
document.addEventListener('input',e=>{const i=e.target.closest('[data-ev]');if(!i)return;const ve=i.closest('[data-ve]');const s=+(ve.dataset.share||50);const m=parseFloat(i.value.replace(',','.'));const out=i.closest('.card').querySelector('[data-evout]');out.innerHTML=(m>0&&isFinite(m))?evOut(amounts(s).profit,m):`<p class="small muted" style="margin:0">${esc(t('ve.ev.empty'))}</p>`;});

/* tooltip: nearest-point for dots, crosshair for lines. Built with textContent. */
const tip=document.getElementById('tip');
function showTip(reg,idx,cx,cy,svg){
  tip.replaceChildren();
  if(reg.kind==='p'){const p=reg.pts[idx];const a=document.createElement('div');a.className='tv';a.textContent=p.v;tip.append(a);const b=document.createElement('div');b.textContent=p.n;tip.append(b);if(p.e){const c=document.createElement('div');c.className='ts';c.textContent=t('ov.list.rev')+' '+p.e;tip.append(c);}}
  else{const r=reg.rows[idx];const h=document.createElement('div');h.className='th';h.textContent=r.h;tip.append(h);for(const [k,v,l] of r.r){const row=document.createElement('div');row.className='tr';const i=document.createElement('i');if(k==='d')i.className='d';if(k==='b')i.className='b';const vv=document.createElement('span');vv.className='tv';vv.textContent=v;const ll=document.createElement('span');ll.className='ts';ll.textContent=l;row.append(i,vv,ll);tip.append(row);}
    const xh=svg.querySelector('.xh');if(xh){xh.setAttribute('x1',reg.xs[idx]);xh.setAttribute('x2',reg.xs[idx]);xh.setAttribute('visibility','visible');}}
  tip.style.display='block';
  const w=tip.offsetWidth,h=tip.offsetHeight;let L=cx+14,T=cy-h-10;if(L+w>innerWidth-8)L=cx-w-14;if(T<8)T=cy+16;tip.style.left=L+'px';tip.style.top=T+'px';
}
function hideTip(){tip.style.display='none';document.querySelectorAll('.xh').forEach(x=>x.setAttribute('visibility','hidden'));}
function nearest(reg,sx,sy){let best=-1,bd=1e9;if(reg.kind==='p'){reg.pts.forEach((p,i)=>{const d=Math.hypot(p.x-sx,p.y-sy);if(d<bd){bd=d;best=i;}});return bd<=24?best:-1;}reg.xs.forEach((x,i)=>{const d=Math.abs(x-sx);if(d<bd){bd=d;best=i;}});return best;}
let curSvg=null;
document.addEventListener('pointermove',e=>{
  const svg=e.target.closest&&e.target.closest('svg[data-chart]');
  if(!svg){if(curSvg){hideTip();curSvg=null;}return;}
  const reg=REG[svg.dataset.chart];if(!reg)return;curSvg=svg;
  const rc=svg.getBoundingClientRect();const vb=svg.viewBox.baseVal;const sx=(e.clientX-rc.left)*vb.width/rc.width,sy=(e.clientY-rc.top)*vb.height/rc.height;
  document.querySelectorAll('.xh').forEach(x=>x.setAttribute('visibility','hidden'));
  const i=nearest(reg,sx,sy);if(i<0){tip.style.display='none';return;}
  showTip(reg,i,e.clientX,e.clientY,svg);
});
const kIdx=new WeakMap();
function focusShow(svg,i){const reg=REG[svg.dataset.chart];const n=reg.kind==='p'?reg.pts.length:reg.xs.length;i=(i+n)%n;kIdx.set(svg,i);const rc=svg.getBoundingClientRect();const vb=svg.viewBox.baseVal;const px=reg.kind==='p'?reg.pts[i].x:reg.xs[i];const py=reg.kind==='p'?reg.pts[i].y:vb.height/2;showTip(reg,i,rc.left+px*rc.width/vb.width,rc.top+py*rc.height/vb.height,svg);}
document.addEventListener('focusin',e=>{const s=e.target.closest&&e.target.closest('svg[data-chart]');if(s&&REG[s.dataset.chart])focusShow(s,0);});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('svg[data-chart]'))hideTip();});
document.addEventListener('keydown',e=>{const s=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('svg[data-chart]');if(!s)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();focusShow(s,(kIdx.get(s)||0)+(e.key==='ArrowRight'?1:-1));}if(e.key==='Escape')hideTip();});
window.addEventListener('scroll',hideTip,{passive:true});
</script>
