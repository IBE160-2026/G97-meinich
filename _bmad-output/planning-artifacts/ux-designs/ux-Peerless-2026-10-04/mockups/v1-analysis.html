<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peerless v1 analyse</title>
<style>
/* Governs: EXPERIENCE.md analysis page (Oversikt, Peers, Nøkkeltall og gap, Verdi), docs/key-figures.md
   "Decompositions" and "From gap to kroner", .memlog.md decisions of 2026-10-10 (v1 scope, waterfall,
   factor-vs-own-median, beeswarm, no sparklines, no account wall). */
/* Fixed tokens (light only):
   text #0B2340 · primary #1F3A5F · link #2F5D8C · signature #7399C6 (markers only, never text)
   surface #F5F7FA · divider #D9E0E8 · input border #7B8BA0 · slate #5B6B7F
   favourable #1F6F8B · unfavourable #B45309 · median tick #6B7C91
   Peer dots #7B8BA0. Chart gridlines #E6EBF1. No red or green; direction is always an arrow or a word. */
:root{--text:#0B2340;--primary:#1F3A5F;--link:#2F5D8C;--sig:#7399C6;--surface:#F5F7FA;--divider:#D9E0E8;--input:#7B8BA0;--slate:#5B6B7F;--fav:#1F6F8B;--unf:#B45309;--median:#6B7C91;--grid:#E6EBF1;--bg:#E9EDF2}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45}
a{color:var(--link);text-underline-offset:2px}
button{font:inherit;color:inherit}
/* review chrome */
.page{max-width:1700px;margin:0 auto;padding:24px 16px 64px}
.page>h1{font-size:22px;margin:0 0 6px}
.rvtext{max-width:900px;color:var(--slate);margin:4px 0}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.jump a{border:1px solid var(--input);border-radius:4px;padding:4px 10px;background:#fff;text-decoration:none;color:var(--text)}
.tabsec{margin-top:44px;border-top:2px solid var(--primary);padding-top:14px}
.tabsec>h2{margin:0 0 4px;font-size:19px}
.tabsec>h3{margin:28px 0 0;font-size:16px}
.frames{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;margin-top:14px}
.fcol{max-width:100%;min-width:0}
.fwrap{max-width:100%;overflow-x:auto}
.flabel{font-size:12px;color:var(--slate);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.desk{width:1202px;background:#fff;border:1px solid #C9D2DC;border-radius:6px;box-shadow:0 1px 2px rgba(11,35,64,.06)}
.phone{width:395px;background:#fff;border:10px solid #1B2533;border-radius:28px;overflow:hidden}
.chrome{height:30px;background:#EEF1F5;border-bottom:1px solid var(--divider);border-radius:6px 6px 0 0;display:flex;align-items:center;padding:0 12px;gap:6px;font-size:12px;color:var(--slate)}
.chrome i{width:10px;height:10px;border-radius:50%;background:#C9D2DC;display:inline-block}
.chrome .url{margin-left:12px;background:#fff;border:1px solid var(--divider);border-radius:4px;padding:2px 10px}
.phurl{background:#EEF1F5;font-size:11.5px;color:var(--slate);text-align:center;padding:6px 0 5px;border-bottom:1px solid var(--divider)}
.rv{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);border:1px solid var(--divider);background:#fff;border-radius:3px;padding:1px 6px;margin:0 0 6px}
.states{display:flex;flex-wrap:wrap;gap:24px;margin-top:14px;align-items:flex-start}
.state{width:375px;max-width:100%;background:#fff;border:1px solid #C9D2DC;border-radius:6px;padding:20px 16px;min-width:0}
.state .cap{font-size:12px;color:var(--slate);margin:12px 0 0;border-top:1px dashed var(--divider);padding-top:8px}

/* ---------- app ---------- */
.app{background:#fff;color:var(--text);width:100%;overflow:hidden}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--slate)} .small{font-size:12px}
.top{display:flex;align-items:center;gap:20px;padding:12px 32px;border-bottom:1px solid var(--divider)}
.ph .top{gap:12px;padding:10px 16px}
.brand{font-weight:700;font-size:17px;letter-spacing:.01em;color:var(--primary);text-decoration:none;white-space:nowrap}
.org{display:flex;align-items:center;gap:6px}
.org input{font:inherit;font-size:13px;font-variant-numeric:tabular-nums;border:1px solid var(--input);border-radius:4px;padding:5px 8px;width:160px;color:var(--text);background:#fff}
.ph .org{flex:1;min-width:0}.ph .org input{width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sp{flex:1}
.top a.how{white-space:nowrap;font-size:13.5px}
.ph .top a.how{font-size:12.5px;white-space:normal;line-height:1.2;text-align:right;max-width:92px}
.co{padding:22px 32px 0}
.ph .co{padding:16px 16px 0}
.co h1{font-size:24px;margin:0 0 4px;line-height:1.2}
.ph .co h1{font-size:21px}
.meta{display:flex;flex-wrap:wrap;gap:2px 0;color:var(--slate);font-size:13px}
.meta span:not(:last-child)::after{content:"·";margin:0 7px;color:var(--input)}
.tabs{display:flex;gap:2px;padding:0 32px;border-bottom:1px solid var(--divider);margin-top:16px}
.ph .tabs{padding:0 8px;gap:0}
.tab{background:none;border:0;color:var(--slate);padding:11px 12px;white-space:nowrap;cursor:pointer;text-decoration:none}
.ph .tab{white-space:normal;font-size:13px;padding:9px 7px;line-height:1.2;text-align:left;flex:1 1 auto}
.tab.on{color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--primary)}
.main{padding:32px 32px 8px}
.ph .main{padding:20px 16px 4px}
.foot{font-size:12.5px;color:var(--slate);border-top:1px solid var(--divider);margin:40px 32px 0;padding:16px 0 22px}
.ph .foot{margin:28px 16px 0}
.foot p{margin:0}
.scroll{overflow-x:auto;max-width:100%}

/* cards & grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px}
.ph .grid{grid-template-columns:minmax(0,1fr);gap:16px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c12{grid-column:span 12}
.ph .grid>*{grid-column:auto}
.card{border:1px solid var(--divider);border-radius:6px;padding:24px;background:#fff;min-width:0}
.ph .card{padding:16px}
.card h3{margin:0 0 2px;font-size:15px}
.kick{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);font-weight:600;margin:0 0 6px}
.hero .fig{font-size:15px;font-weight:600;margin:0 0 10px}
.hero .big{font-size:52px;font-weight:600;line-height:1.05;letter-spacing:-.01em}
.ph .hero .big{font-size:40px}
.hero .per{font-size:14px;color:var(--slate);margin:4px 0 18px}
.hero .vs{font-size:18px;margin:0}
.hero .ctx{color:var(--slate);margin:6px 0 18px}
.links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.sc .val{font-size:22px;font-weight:600;margin:8px 0 4px}
.sc .val .vl{font-size:13px;font-weight:500;color:var(--slate);display:block;margin-bottom:1px}
.sc .val .vu{font-size:13px;font-weight:500;color:var(--text)}
.sc .line{margin:0 0 2px;color:var(--slate);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border:1px solid var(--input);border-radius:3px;padding:1px 6px;color:var(--text);white-space:nowrap}
.tag.soft{border-color:var(--divider);color:var(--slate)}
.dir-up{color:var(--fav);font-weight:600}
.dir-dn{color:var(--unf);font-weight:600}
.expl p.txt{margin:6px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:110ch}
.expl.open p.txt{display:block}
.expl .src{font-size:12px;color:var(--slate);margin:8px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--slate);margin:8px 0 6px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend b{color:var(--text);font-weight:600}
.plotwrap{position:relative}
.plotwrap svg{display:block}
svg text{font-family:inherit}
.ax{font-size:11px;fill:var(--slate);font-variant-numeric:tabular-nums}
.axl{font-size:11px;fill:var(--slate)}
svg[data-chart]{outline:none}
svg[data-chart]:focus-visible{outline:2px solid var(--link);outline-offset:2px}
table.lst{border-collapse:collapse;width:100%;font-size:13px}
.lst th,.lst td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--divider);vertical-align:top}
.lst thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600;border-bottom:1px solid var(--input)}
.lst td.r,.lst th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lst tr.ex td{color:#6F7E90}
.lst tr.ex td.nm{text-decoration:line-through;text-decoration-color:#B5C0CC}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--unf);font-weight:600;white-space:nowrap}
.basis{white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:13px;white-space:nowrap}

/* funnel */
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:10px 0 6px;list-style:none;padding:0}
.funnel li{padding:0 14px 0 0;position:relative}
.funnel li+li{padding-left:14px;border-left:1px solid var(--divider)}
.funnel .st{font-size:12.5px;color:var(--slate);min-height:34px}
.funnel .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.funnel .bar{height:8px;background:var(--surface);border-radius:2px;margin-top:6px;position:relative}
.funnel .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:0 4px 4px 0}
.ph .funnel{grid-template-columns:minmax(0,1fr)}
.ph .funnel li{display:grid;grid-template-columns:1fr auto;align-items:center;padding:8px 0;border-left:0;border-bottom:1px solid var(--divider)}
.ph .funnel li+li{padding-left:0}
.ph .funnel .st{min-height:0;font-size:13px;color:var(--text)}
.ph .funnel .n{font-size:17px}
.ph .funnel .bar{grid-column:1/-1;height:6px;margin-top:4px}
.fsum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--input);border-radius:5px;overflow:hidden;max-width:100%}
.seg button{background:#fff;border:0;padding:7px 12px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--input)}
.seg button.on{background:var(--primary);color:#fff;font-weight:600}
.seg button[disabled]{color:#6F7E90;background:var(--surface);cursor:not-allowed}
.seg button small{display:block;font-size:10.5px;font-weight:400;opacity:.85}
.ph .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:1px;background:var(--input)}
.ph .seg button{padding:7px 4px;white-space:normal}
.ph .seg button+button{border-left:0}
.banner{border:1px solid var(--input);border-left:4px solid var(--primary);background:var(--surface);padding:10px 12px;border-radius:4px;font-size:13px;margin:10px 0}
.pcards{list-style:none;padding:0;margin:0}
.pcards li{border-bottom:1px solid var(--divider);padding:10px 0;font-size:13px}
.pcards .r1{display:flex;justify-content:space-between;gap:10px}
.pcards .r1 span{font-variant-numeric:tabular-nums;white-space:nowrap}
.pcards .r1 .nm{font-weight:600;white-space:normal}
.pcards .why{color:var(--slate);margin:2px 0 4px}
.pcards .r3{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pcards li.ex{color:#6F7E90}
.pcards li.ex .nm{text-decoration:line-through;text-decoration-color:#B5C0CC}

/* key figure table */
.topnote{font-size:13px;color:var(--slate);margin:0 0 10px}
table.kt{border-collapse:collapse;width:100%;font-size:13px}
.kt th,.kt td{padding:10px 8px;border-bottom:1px solid var(--divider);vertical-align:middle}
.kt thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600;border-bottom:1px solid var(--input);text-align:right;white-space:nowrap}
.kt thead th.l{text-align:left}
.kt td{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kt td.l,.kt th.nmc{text-align:left}
.kt th.nmc{font-weight:600;white-space:normal;min-width:200px}
.kt .sub2{display:block;font-size:11.5px;font-weight:400;color:var(--slate)}
.kt tr.grp td{background:var(--surface);font-size:11.5px;color:var(--slate);text-align:left;padding:5px 8px 5px 30px;white-space:normal}
.kt tr.sub th.nmc{padding-left:30px;font-weight:500;position:relative}
.kt tr.sub th.nmc::before{content:"";position:absolute;left:14px;top:0;bottom:0;border-left:2px solid var(--divider)}
.kt tr.check th.nmc,.kt tr.check td{color:var(--slate);font-size:12.5px}
.kt .kr{font-weight:600}
.kt .kr small{display:block;font-weight:400;color:var(--slate);font-size:11px}
.kt .see{font-size:12.5px;white-space:normal;display:inline-block;max-width:130px;text-align:right}
.kt td.floor{text-align:left;font-style:italic;white-space:normal}
.kt tr.fold>td{background:#FBFCFD;text-align:left;white-space:normal;padding:0 12px 0 30px}
.fold-h{display:flex;align-items:center;gap:8px;padding:10px 0;font-weight:600;font-size:13.5px}
.fold-h .car{display:inline-block;width:10px;color:var(--slate)}
.fold-b{padding:0 0 18px 18px}
.ph .fold-b{padding:0 0 12px 0}
.refline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 8px;font-size:13px}
.refline .tag{font-weight:600}
.fnote{font-size:12.5px;color:var(--slate);margin:4px 0 0;max-width:100ch}
.fnote.strong{color:var(--text)}
details.tv{margin-top:10px;font-size:12.5px}
details.tv summary{cursor:pointer;color:var(--link)}
table.dec{border-collapse:collapse;font-size:13px;margin:6px 0 4px}
.dec th,.dec td{padding:5px 14px 5px 0;border-bottom:1px solid var(--divider);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dec th:first-child,.dec td:first-child{text-align:left}
.dec thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600}
.dec tr.res td{font-weight:600;border-bottom:0}
.factors{display:grid;grid-template-columns:repeat(2,minmax(0,360px));gap:24px;margin:8px 0}
.ph .factors{grid-template-columns:minmax(0,1fr);gap:12px}
.factor{border:1px solid var(--divider);border-radius:6px;padding:12px 14px;background:#fff;min-width:0}
.factor h4{margin:0;font-size:13px}
.factor .fv{font-size:13px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
/* phone rows */
.prow{border-bottom:1px solid var(--divider)}
.prow .ph3{display:grid;grid-template-columns:minmax(0,1fr) 64px 104px;gap:8px;align-items:center;padding:10px 0;font-size:13px}
.prow .ph3 .n1{font-weight:600}
.prow .ph3 .n1 .car{color:var(--slate);display:inline-block;width:12px}
.prow .ph3 .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .ph3 .k{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:normal;font-size:12.5px}
.prow.sub .ph3{padding-left:14px}
.prow.sub .ph3 .n1{font-weight:500}
.prow .k .seeL{font-weight:400;color:var(--link);text-decoration:underline;text-underline-offset:2px}
.pgrp{font-size:11.5px;color:var(--slate);background:var(--surface);padding:5px 8px;margin-top:4px}
.phhead{display:grid;grid-template-columns:minmax(0,1fr) 64px 104px;gap:8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600;border-bottom:1px solid var(--input);padding-bottom:6px}
.phhead span+span{text-align:right}
.pexp{padding:2px 0 14px 12px;font-size:13px}
.pexp dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:8px 0 10px}
.pexp dt{color:var(--slate)}.pexp dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.pexp .wfbox{border-top:1px solid var(--divider);margin-top:6px}
/* waterfall rows (phone) */
.wfrows{list-style:none;margin:6px 0 0;padding:0}
.wfrows li{padding:7px 0;border-bottom:1px solid var(--divider)}
.wfrows .wl{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.wfrows .wl b{font-weight:600}
.wfrows .wl .wv{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.wfrows .ws{font-size:11.5px;color:var(--slate)}
.wfrows svg{display:block;margin-top:4px}
.wfrows li.tot{border-bottom:0}
/* verdi */
.ctl{border:1px solid var(--divider);border-radius:6px;padding:20px 24px}
.ph .ctl{padding:14px}
.ctl .seg{margin-top:10px}
.ctl .seg button{min-width:72px}
.ph .ctl .seg button{min-width:0}
.medline{font-size:12.5px;color:var(--slate);margin:8px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mtick{display:inline-block;width:2px;height:12px;background:var(--median)}
.amts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:24px}
.ph .amts{grid-template-columns:minmax(0,1fr);gap:14px}
.amt .val{font-size:30px;font-weight:600;line-height:1.1;margin:6px 0 2px}
.ph .amt .val{font-size:26px}
.amt .val.na{font-size:15px;font-weight:500;line-height:1.35}
.amt .per{font-size:12.5px;color:var(--slate)}
.amt .mt{font-size:12px;color:var(--slate);margin-top:8px;display:flex;align-items:center;gap:6px}
.amt .sep{font-size:12px;color:var(--slate);margin-top:6px}
.trace{margin-top:12px;border-top:1px solid var(--divider);padding-top:10px;font-size:13px}
.trace ol{margin:6px 0 0;padding-left:20px}
.trace li{margin:0 0 8px}
.trace .calc{font-variant-numeric:tabular-nums;background:var(--surface);padding:6px 8px;border-radius:4px;display:inline-block;margin-top:3px;white-space:normal}
.trace code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--slate)}
.evrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:24px}
.ph .evrow{grid-template-columns:minmax(0,1fr);gap:14px}
.evf{display:flex;align-items:center;gap:8px;margin:8px 0}
.evf input{width:90px;font:inherit;border:1px solid var(--input);border-radius:4px;padding:6px 8px;font-variant-numeric:tabular-nums}
.below{margin-top:24px}
/* tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;background:#fff;border:1px solid var(--divider);box-shadow:0 2px 8px rgba(11,35,64,.14);border-radius:5px;padding:7px 9px;font-size:12px;line-height:1.35;min-width:120px;display:none;color:var(--text)}
.tip.static{position:absolute;display:block}
.tip .tv{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.tip .ts{color:var(--slate)}
.tip.static::after{content:"";position:absolute;left:var(--ax,50%);bottom:-6px;width:10px;height:10px;background:#fff;border-right:1px solid var(--divider);border-bottom:1px solid var(--divider);transform:translateX(-50%) rotate(45deg)}
.fwrap,.app,.state{position:relative}
.ph table.dec{font-size:12px;width:100%}
.ph .dec th,.ph .dec td{padding:5px 6px 5px 0}
.ph .dec td:first-child{white-space:normal}

</style>
</head>
<body>
<div class="page" id="root"></div>
<div class="tip" id="tip" role="tooltip"></div>
<script>
/*MSG-START*/
const messages = {
  "shell.brand": "Peerless",
  "shell.how": "Slik fungerer Peerless",
  "shell.orgnr.label": "Organisasjonsnummer",
  "shell.orgnr.placeholder": "Org.nr.",
  "shell.tabsLabel": "Faner i analysen",
  "footer.source": "Data fra Brønnøysundregistrene, bearbeidet av Peerless",
  "footer.sourcesLink": "Kilder og lisens",
  "industry.62100": "62.100 Dataprogrammeringstjenester",
  "industry.69202": "69.202 Regnskapsføring og bokføring",
  "front.title": "Sammenlign selskapet ditt med selskaper som faktisk ligner",
  "front.lead": "Peerless finner sammenlignbare selskaper i offentlige regnskaper, sammenligner nøkkeltallene og viser hva hvert avvik er verdt i kroner.",
  "front.search.label": "Organisasjonsnummer",
  "front.search.placeholder": "Organisasjonsnummer, f.eks. 912 345 678",
  "front.search.submit": "Sammenlign",

const T_DM_PERMILLE = 91n, T_OML_HUNDREDTHS = 307n;

const P_SUM = {n:22, revenue:393800000, driftsresultat:1969000, varekostnad:44105600, lonnskostnad:251638200, annenDriftskostnad:82698000, rest:13389200};

/* ---------------- exact arithmetic (BigInt, round half away from zero) ---------------- */
function divRound(num,den){ /* den > 0 */ const neg=num<0n; const a=neg?-num:num; const q=a/den, rm=a%den; const r=(rm*2n>=den)?q+1n:q; return Number(neg?-r:r); }
function divFloor(num,den){ const q=num/den; return (num%den!==0n && (num<0n)!==(den<0n))?q-1n:q; }
/* Profit uplift: (T − r) × revenue × s, with T = 91/1000 and r = driftsresultat/revenue  ⇒ (91·rev − 1000·dr)/1000 × s/100 */
function profitAt(s){ return divRound((T_DM_PERMILLE*BigInt(D.revenue) - 1000n*BigInt(D.driftsresultat))*BigInt(s), 100000n); }
/* Capital released, operating assets: ((sumEiendeler − bank) − revenue/T) × s, T = 307/100 */
function opAssetAt(s){ const opA=BigInt(D.sumEiendeler-D.bankinnskudd); return divRound((T_OML_HUNDREDTHS*opA - 100n*BigInt(D.revenue))*BigInt(s), 307n*100n); }
/* EV = exact profit uplift × multiple (multiple in tenths) */
function evAt(s,m10){ return divRound((T_DM_PERMILLE*BigInt(D.revenue) - 1000n*BigInt(D.driftsresultat))*BigInt(s)*BigInt(m10), 100000n*10n); }
/* Margin decomposition against peer-gruppen samlet. Bar_x = (A_x − c_x) × rev = (Σx·rev − x·ΣR)/ΣR.
   Sign: positive = Fjordkode spends less than samlet. Largest-remainder rounding to whole kroner. */
const WF_KEYS=['vare','lonn','andre','rest'];
const WF_FIELD={vare:'varekostnad',lonn:'lonnskostnad',andre:'annenDriftskostnad',rest:'rest'};
function waterfall(){
  const rev=BigInt(D.revenue), SR=BigInt(P_SUM.revenue);
  const nums=WF_KEYS.map(k=>BigInt(P_SUM[WF_FIELD[k]])*rev - BigInt(D[WF_FIELD[k]])*SR);
  const totNum=BigInt(D.driftsresultat)*SR - BigInt(P_SUM.driftsresultat)*rev;
  const exactSum=nums.reduce((a,b)=>a+b,0n);
  if(exactSum!==totNum) throw new Error('decomposition does not sum');
  const total=divRound(totNum,SR);
  const floors=nums.map(n=>divFloor(n,SR)); const rems=nums.map((n,i)=>n-floors[i]*SR);
  let short=BigInt(total)-floors.reduce((a,b)=>a+b,0n);
  const order=rems.map((r,i)=>[r,i]).sort((a,b)=>(b[0]>a[0]?1:b[0]<a[0]?-1:0));
  const bars=floors.slice(); for(let j=0;j<Number(short);j++)bars[order[j][1]]+=1n;
  const out={total, bars:Object.fromEntries(WF_KEYS.map((k,i)=>[k,Number(bars[i])])), exact:Object.fromEntries(WF_KEYS.map((k,i)=>[k,Number(nums[i])/Number(SR)]))};
  out.end=D.driftsresultat; out.start=D.driftsresultat-total; /* = samlet margin × revenue, rounded */
  if(out.start!==divRound(BigInt(P_SUM.driftsresultat)*rev,SR)) throw new Error('start mismatch');
  if(WF_KEYS.reduce((a,k)=>a+out.bars[k],0)!==total) throw new Error('bars do not sum');
  return out;
}

  s+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="#D9E0E8"/>`;
  const a=x(d.q1),b=x(d.q3); s+=`<rect x="${Math.min(a,b)}" y="${y-3}" width="${Math.abs(b-a)}" height="6" rx="2" fill="#D9E0E8"/>`;
  s+=medTick(x(d.med),y-8,y+8);
  const pts=[{x:x(ownV),y,v:fv(ownV,u),n:D.name},{x:x(d.med),y,v:fv(d.med,u),n:t('legend.median')},{x:Math.min(a,b),y,v:fv(mir?d.q3:d.q1,u)+' – '+fv(mir?d.q1:d.q3,u),n:t('legend.mid')}];
  if(d.best!=null){s+=bestTri(x(d.best),y-6);pts.push({x:x(d.best),y:y-8,v:fv(d.best,u),n:t('legend.best')});}
  s+=ownDot(x(ownV),y,5);
  s+='</svg>';
  REG[id]={pts};
  return s;
}

/* Waterfall, desktop: columns from peer-gruppen samlet's margin (in kroner on Fjordkode's revenue) to Fjordkode's driftsresultat. */
function wfSteps(){
  let run=WF.start; const steps=[{kind:'start',from:0,to:WF.start}];
  for(const k of WF_KEYS){const v=WF.bars[k];steps.push({kind:k,from:run,to:run+v,v});run+=v;}
  steps.push({kind:'end',from:0,to:run});
  if(run!==WF.end) throw new Error('waterfall end mismatch');
  return steps;
}
function wfWord(v){return v>=0?t('gap.wf.lower'):t('gap.wf.higher');}
function wfName(k){return k==='start'?t('gap.wf.start'):k==='end'?t('gap.wf.end'):t('gap.wf.c.'+k);}
function wfTipPoint(st,x,y,w,h){
  if(st.kind==='start')return {x,y,w,h,v:kr(WF.start),n:t('gap.wf.start'),e:t('gap.wf.marginAt',{m:pct(ALL.dm)})};
  if(st.kind==='end')return {x,y,w,h,v:kr(WF.end),n:t('gap.wf.end'),e:t('gap.wf.marginAt',{m:pct(OWN.dm)})};
  return {x,y,w,h,v:krSigned(st.v)+' · '+wfWord(st.v),n:t('gap.wf.c.'+st.kind),e:t('gap.wf.shares',{own:pct(OWN[st.kind]),all:pct(ALL[st.kind])})};
}
function wrapWords(s,max){const w=s.split(' ');const lines=[];let cur='';for(const x of w){if((cur+' '+x).trim().length>max&&cur){lines.push(cur);cur=x;}else cur=(cur+' '+x).trim();}if(cur)lines.push(cur);return lines;}
function waterfallDesk(W=860){
  const id=uid('wf'); const steps=wfSteps();
  const L=86,Rr=10,T=26,plotH=210,B=64,H=T+plotH+B;
  const max=1200000;
  const y=v=>T+(1-v/max)*plotH;
  const slot=(W-L-Rr)/steps.length, bw=24;
  let s=`<svg data-chart="${id}" tabindex="0" role="img" aria-label="${esc(t('gap.wf.title'))}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for(const tv of [0,400000,800000,1200000]){s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(tv)}" y2="${y(tv)}" stroke="${tv===0?'#B9C3CF':'#E6EBF1'}"/><text class="ax" x="${L-8}" y="${y(tv)+4}" text-anchor="end">${esc(kr(tv))}</text>`;}
  const pts=[];
  steps.forEach((st,i)=>{
    const cx=L+slot*i+slot/2, x0=cx-bw/2;
    const top=Math.min(y(st.from),y(st.to)), bot=Math.max(y(st.from),y(st.to)), h=Math.max(bot-top,1.5);
    const col=st.kind==='start'?'#6B7C91':st.kind==='end'?'#1F3A5F':(st.v>=0?'#1F6F8B':'#B45309');
    /* rounded data end (4px), square where the step starts */
    const up=st.to>=st.from;
    const r=Math.min(4,h/2);
    const path=up?`M${x0} ${bot}V${top+r}a${r} ${r} 0 0 1 ${r} ${-r}h${bw-2*r}a${r} ${r} 0 0 1 ${r} ${r}V${bot}Z`:`M${x0} ${top}V${bot-r}a${r} ${r} 0 0 0 ${r} ${r}h${bw-2*r}a${r} ${r} 0 0 0 ${r} ${-r}V${top}Z`;
    s+=`<path d="${path}" fill="${col}"/>`;
    if(i<steps.length-1){const nx=L+slot*(i+1)+slot/2-bw/2;s+=`<line x1="${x0+bw}" x2="${nx}" y1="${y(st.to)}" y2="${y(st.to)}" stroke="#B9C3CF"/>`;}
    const lab=st.kind==='start'?kr(WF.start):st.kind==='end'?kr(WF.end):krSigned(st.v);
    const ly=top-7;
    s+=`<text x="${cx}" y="${ly}" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#0B2340;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#fff;stroke-width:3px">${esc(lab)}</text>`;
    const nm=wrapWords(wfName(st.kind),18);
    let ty=T+plotH+16;
    nm.forEach(line=>{s+=`<text x="${cx}" y="${ty}" text-anchor="middle" style="font-size:11.5px;font-weight:600;fill:#0B2340">${esc(line)}</text>`;ty+=14;});
    const sub=st.kind==='start'?t('gap.wf.marginAt',{m:pct(ALL.dm)}):st.kind==='end'?t('gap.wf.marginAt',{m:pct(OWN.dm)}):(st.v>=0?'▲ ':'▼ ')+wfWord(st.v);
    s+=`<text class="axl" x="${cx}" y="${ty}" text-anchor="middle">${esc(sub)}</text>`;ty+=13;
    if(st.kind!=='start'&&st.kind!=='end')s+=`<text class="ax" x="${cx}" y="${ty}" text-anchor="middle">${esc(t('gap.wf.shares',{own:pct(OWN[st.kind]),all:pct(ALL[st.kind])}))}</text>`;
    pts.push(wfTipPoint(st,cx,(top+bot)/2,bw+8,h+8));
  });
  s+='</svg>';
  REG[id]={pts};
  return s;
}
function wfLegend(){
  const sw=c=>`<svg width="12" height="12" aria-hidden="true"><rect width="12" height="12" rx="2" fill="${c}"/></svg>`;

/* Waterfall, phone: one row per step, floating bar on a shared kroner scale. */
function waterfallPhone(W=300){

function foldA(P){
  const W=P?290:330;
  return `<p style="margin:0 0 8px;max-width:100ch">${esc(t('gap.dec.lead'))}</p>
  <div class="factors">
   <div class="factor"><h4>${esc(t('gap.dec.margin'))}</h4><div class="fv">${esc(t('gap.dec.ownMed',{own:pct(OWN.dm),med:pct(DIST.dm.med)}))}</div><div class="scroll">${distStrip('dm',W)}</div></div>
   <div class="factor"><h4>${esc(t('gap.dec.turn'))}</h4><div class="fv">${esc(t('gap.dec.ownMed',{own:N2.format(OWN.turn),med:N2.format(DIST.turn.med)}))}</div><div class="scroll">${distStrip('turn',W,DIST.turn,OWN.turn,'x','up')}</div></div>
  </div>
  <p style="margin:6px 0 4px">${esc(t('gap.dec.text',{m1:pct(OWN.dm),m2:pct(DIST.dm.med),t1:N2.format(OWN.turn),t2:N2.format(DIST.turn.med)}))}</p>
  <p class="fnote strong">${esc(t('gap.dec.noMult'))}</p>
  <p class="fnote">${esc(t('gap.dec.turnNote'))}</p>`;
}
function gapLegend(){return `<div class="legend"><span><svg width="16" height="16" aria-hidden="true">${ownDot(8,8,5)}</svg>${esc(t('legend.own'))}</span><span><svg width="6" height="14" aria-hidden="true"><line x1="3" x2="3" y1="0" y2="14" stroke="#6B7C91" stroke-width="2"/></svg>${esc(t('legend.median'))}</span><span><svg width="12" height="10" aria-hidden="true">${bestTri(6,9)}</svg>${esc(t('legend.best'))}</span><span><svg width="18" height="8" aria-hidden="true"><rect y="1" width="18" height="6" rx="2" fill="#D9E0E8"/></svg>${esc(t('legend.mid'))}</span><span>${esc(t('better'))}</span></div>`;}
function gapDesk(){
  let rows='';
  for(const r of ROWS){
    if(r.grp){rows+=`<tr class="grp"><td colspan="7">${esc(t('gap.group'))}</td></tr>`;continue;}
    const f=F[r.k],d=DIST[r.k];
    const cls=r.kind==='check'?'sub check':r.kind==='sub'?'sub':'';
    let mid;
    if(r.kind==='floor')mid=`<td colspan="4" class="floor">${esc(t('floor',{n:7}))}</td>`;
    else if(r.kind==='none')mid=`<td>${esc(fv(d.med,f.u))}</td><td colspan="2" class="l muted">${esc(t('gap.mid',{lo:fv(d.q1,f.u),hi:fv(d.q3,f.u)}))}</td><td class="l">${distStrip(r.k)}</td>`;
    else if(r.kind==='check')mid=`<td>${esc(fv(d.med,f.u))}</td><td>—</td><td>—</td><td></td>`;
    else mid=`<td>${esc(fv(d.med,f.u))}</td><td>${esc(fv(d.best,f.u))}</td><td>${esc(t('placement',{v:d.plc}))}</td><td class="l">${distStrip(r.k)}</td>`;
    rows+=`<tr class="${cls}"><th class="nmc" scope="row">${esc(t(f.k))}<span class="sub2">${esc(dirLabel(f))} · ${esc(r.kind==='floor'?t('count.all',{n:7}):countLabel(d))}</span></th><td>${esc(fv(f.own,f.u))}</td>${mid}<td>${krCell(r)}</td></tr>`;
    if(r.fold==='WF')rows+=`<tr class="fold" id="wf"><td colspan="7"><div class="fold-h"><span class="car">▾</span>${esc(t('gap.wf.title'))}</div><div class="fold-b">${wfBlock(false)}</div></td></tr>`;
    if(r.fold==='A')rows+=`<tr class="fold"><td colspan="7"><div class="fold-h"><span class="car">▾</span>${esc(t('gap.decA'))}</div><div class="fold-b">${foldA(false)}</div></td></tr>`;
    if(r.fold==='B')rows+=`<tr class="fold"><td colspan="7"><div class="fold-h"><span class="car">▸</span>${esc(t('gap.decB'))}</div></td></tr>`;
  }
  return `<p class="topnote">${esc(t('gap.topnote'))}<a href="#">${esc(t('gap.topnoteLink'))}</a></p>${gapLegend()}
  <div class="scroll"><table class="kt"><thead><tr><th class="l">${esc(t('gap.col.fig'))}</th><th>${esc(t('gap.col.own'))}</th><th>${esc(t('gap.col.med'))}</th><th>${esc(t('gap.col.best'))}</th><th>${esc(t('gap.col.plc'))}</th><th class="l">${esc(t('gap.col.dist'))}</th><th>${esc(t('gap.col.kr'))}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function gapPhone(){
  const krShort=r=>{if(r.kind==='floor')return esc(t('gap.phone.floorShort'));if(r.kind==='none')return esc(t('dir.none'));if(r.kind==='check')return esc(t('gap.checkRow'));if(r.kind==='sub')return `<span class="seeL">${esc(t('gap.phone.seeShort'))}</span>`;if(r.k==='dm')return esc(t('gap.krYear',{v:N0.format(PROFIT_FULL)}));if(r.krCap)return esc(kr(OP_FULL));if(r.k==='tkr')return `<span class="muted" style="font-weight:400">${esc(t('noKr'))}</span>`;return '';};
  let out=`<p class="topnote">${esc(t('gap.topnote'))}<a href="#">${esc(t('gap.topnoteLink'))}</a></p><div class="phhead"><span>${esc(t('gap.phone.head1'))}</span><span>${esc(t('gap.phone.head2'))}</span><span>${esc(t('gap.phone.head3'))}</span></div>`;
  for(const r of ROWS){
    if(r.grp){out+=`<div class="pgrp">${esc(t('gap.group'))}</div>`;continue;}
    const f=F[r.k],d=DIST[r.k],open=r.k==='dm';
    out+=`<div class="prow ${r.kind==='sub'||r.kind==='check'?'sub':''}"><div class="ph3"><span class="n1"><span class="car">${open?'▾':'▸'}</span>${esc(t(f.k))}</span><span class="v">${esc(fv(f.own,f.u))}</span><span class="k">${krShort(r)}</span></div>`;
    if(open){
      out+=`<div class="pexp">${gapLegend()}<div class="scroll">${distStrip('dm',300)}</div><dl><dt>${esc(t('gap.col.med'))}</dt><dd>${esc(pct(d.med))}</dd><dt>${esc(t('gap.col.best'))}</dt><dd>${esc(pct(d.best))}</dd><dt>${esc(t('gap.col.plc'))}</dt><dd>${esc(t('placement',{v:d.plc}))}</dd><dt>${esc(t('gap.phone.dir'))}</dt><dd>${esc(t('dir.up'))}</dd><dt>${esc(t('gap.phone.count'))}</dt><dd>${esc(t('count.all',{n:d.n}))}</dd><dt>${esc(t('gap.col.kr'))}</dt><dd>${esc(t('gap.krYear',{v:N0.format(PROFIT_FULL)}))}</dd></dl><div class="wfbox"><div class="fold-h"><span class="car">▾</span>${esc(t('gap.wf.title'))}</div><div class="fold-b">${wfBlock(true)}</div></div></div>`;
    }
    out+='</div>';
  }
  out+=`<p class="small muted" style="margin:10px 0 0">${esc(t('gap.phone.tap'))}</p>`;
  return out;
}

/* ---------------- tab: Verdi ---------------- */
function stepSeg(sel,medShare,medDisabled){
  let items=[0,25,50,75,100].map(s=>({s,label:s+NB+'%'}));
  const med={s:medShare,med:true,label:medDisabled?t('ve.toMedian'):t('ve.toMedianShare',{v:medShare})};
  if(medDisabled)items.unshift(med); else{const i=items.findIndex(x=>x.s>medShare);items.splice(i,0,med);}
  return `<div class="seg" role="radiogroup" aria-label="${esc(t('ve.ctl.title'))}">${items.map(it=>`<button role="radio" data-share="${it.s}" ${it.med?'data-med="1"':''} ${it.med&&medDisabled?'disabled aria-disabled="true" title="'+esc(t('ve.aboveMedian'))+'"':''} aria-checked="${(it.med&&medDisabled)?false:it.s===sel}" class="${it.s===sel&&!(it.med&&medDisabled)?'on':''}">${esc(it.label)}</button>`).join('')}</div>`;
}
function evOut(s,m10){const v=evAt(s,m10);return `<div class="amt"><div class="val">${esc(kr(v))}</div><div class="per">${esc(t('ve.ev.result'))}: ${esc(t('ve.ev.calc',{p:kr(profitAt(s)),m:N1.format(m10/10).replace(/,0$/,''),v:kr(v)}))}</div><div class="per">${esc(t('ve.ev.note'))}</div></div>`;}
function verdi(P){
  const s=50, pr=profitAt(s), op=opAssetAt(s);
  const trace=`<div class="trace"><b data-a="traceTitle">${esc(t('ve.trace.title',{v:kr(pr)}))}</b><ol>
   <li>${esc(t('ve.trace.s1'))}<br><span class="calc" data-a="traceCalc">(${esc(pct(DIST.dm.best))} − ${esc(pct(OWN.dm))}) × ${esc(kr(D.revenue))} × ${s}${NB}% = ${esc(kr(pr))}</span></li>
   <li>${esc(t('ve.trace.s2',{own:pct(OWN.dm),best:pct(DIST.dm.best),n:23}))}<br><span class="calc">${esc(kr(D.driftsresultat))} ÷ ${esc(kr(D.revenue))} = ${esc(pct(OWN.dm))}</span></li>
   <li>${esc(t('ve.trace.s3'))}<br>${esc(t('ve.trace.dr'))} <code>driftsresultat</code>: <b class="tnum">${esc(kr(D.driftsresultat))}</b><br>${esc(t('ve.trace.si'))} <code>sumDriftsinntekter</code>: <b class="tnum">${esc(kr(D.revenue))}</b></li>
   <li>${esc(t('ve.trace.s4'))}</li></ol><button class="linkbtn">${esc(t('ve.trace.close'))}</button></div>`;
  const amt=`<div class="amts">
   <div class="card amt"><p class="kick">${esc(t('ve.amt.profit'))}</p><div class="val" data-a="profit">${esc(kr(pr))}</div><div class="per" data-a="profitPer">${esc(t('ve.amt.at',{v:s}))}</div><div class="mt"><span class="mtick"></span>${esc(t('ve.amt.med'))}</div><p style="margin:10px 0 0;font-size:13px"><a href="#">${esc(t('how'))}</a></p>${trace}</div>
   <div class="card amt"><p class="kick">${esc(t('ve.amt.wc'))}</p><div class="val na">${esc(t('ve.amt.wcNa'))}</div></div>
   <div class="card amt"><p class="kick">${esc(t('ve.amt.op'))}</p><div class="val" data-a="op">${esc(kr(op))}</div><div class="per" data-a="opPer">${esc(t('ve.amt.atOnce',{v:s}))}</div><div class="mt"><span class="mtick"></span>${esc(t('ve.amt.med'))}</div><div class="sep">${esc(t('ve.amt.sep'))}</div><p style="margin:10px 0 0;font-size:13px"><a href="#">${esc(t('how'))}</a></p></div>
  </div>`;
  const ev=filled=>`<div class="card"><span class="rv">${esc(r(filled?'ve.evFilled':'ve.evEmpty'))}</span><p class="kick">${esc(t('ve.ev.title'))}</p><div class="evf"><input data-ev inputmode="decimal" aria-label="${esc(t('ve.ev.label'))}" value="${filled?'6':''}"></div><div data-evout>${filled?evOut(s,60):`<p class="small muted" style="margin:0">${esc(t('ve.ev.empty'))}</p>`}</div></div>`;
  const below=`<div class="card below"><span class="rv">${esc(r('ve.below'))}</span><p class="small muted" style="margin:0 0 4px">${esc(t('ve.belowName',{own:pct(1.0),med:pct(4.0),best:pct(8.1)}))}</p><h3 style="font-size:14px;margin:6px 0 0">${esc(t('ve.ctl.title'))}</h3><div class="scroll" style="padding-top:10px">${stepSeg(42,42,false)}</div><p class="medline"><span class="mtick"></span>${esc(t('ve.belowMed',{v:42}))} · ${esc(t('ve.medianBasis'))}</p></div>`;
  return `<div data-ve data-share="${s}"><div class="ctl"><h3 style="margin:0 0 2px">${esc(t('ve.ctl.title'))}</h3><p class="small muted" style="margin:0">${esc(t('ve.ctl.sub'))}</p><div class="scroll">${stepSeg(s,0,true)}</div><p class="medline"><span class="mtick"></span>${esc(t('ve.aboveMedian'))} · ${esc(t('ve.medianBasis'))}</p></div>${amt}<div class="evrow">${ev(false)}${ev(true)}</div>${below}</div>`;
}

/* ---------------- page ---------------- */
function sec(id,titleKey,note,content){return `<section class="tabsec" id="${id}"><h2>${esc(t(titleKey))}</h2><p class="rvtext">${esc(note)}</p>${content}</section>`;}
const root=document.getElementById('root');
root.innerHTML=`<h1>${esc(r('title'))}</h1><p class="rvtext">${esc(r('intro'))}</p><nav class="jump"><span class="muted" style="align-self:center">${esc(r('jump'))}</span>${TABS.map(([k,m])=>`<a href="#s-${k}">${esc(t(m))}</a>`).join('')}</nav>`
 + sec('s-ov','tabs.oversikt',r('ov.note'),pair('ov',oversikt)
     +`<h3>${esc(r('ov.adjusted'))}</h3><div class="states"><div class="state" style="width:760px">${explCard('',true).replace('class="card  expl"','class="card expl"')}</div><div class="state ph" style="width:375px">${explCard('',true)}</div></div>`)
 + sec('s-pe','tabs.peers',r('pe.note'),pair('pe',peers)+`<h3>${esc(r('pe.widened'))}</h3>`+pair('pe',peersWidened))
 + sec('s-gap','tabs.gap',r('gap.note'),`<div class="frames">${frame(false,'gap',gapDesk())}${frame(true,'gap',gapPhone())}</div>`)
 + sec('s-ve','tabs.verdi',r('ve.note'),pair('ve',verdi));

/* ---------------- interactivity ---------------- */
document.addEventListener('click',e=>{
  const sb=e.target.closest('[data-ve] .ctl [data-share]');
  if(sb&&!sb.disabled){const ve=sb.closest('[data-ve]');const s=+sb.dataset.share;sb.parentNode.querySelectorAll('button').forEach(b=>{if(b.disabled)return;const on=b===sb;b.classList.toggle('on',on);b.setAttribute('aria-checked',on);});
    const pr=profitAt(s),op=opAssetAt(s);ve.dataset.share=s;
    ve.querySelector('[data-a=profit]').textContent=kr(pr);ve.querySelector('[data-a=profitPer]').textContent=t('ve.amt.at',{v:s});
    ve.querySelector('[data-a=op]').textContent=kr(op);ve.querySelector('[data-a=opPer]').textContent=t('ve.amt.atOnce',{v:s});
    ve.querySelector('[data-a=traceTitle]').textContent=t('ve.trace.title',{v:kr(pr)});
    ve.querySelector('[data-a=traceCalc]').textContent=`(${pct(DIST.dm.best)} − ${pct(OWN.dm)}) × ${kr(D.revenue)} × ${s}${NB}% = ${kr(pr)}`;
    ve.querySelectorAll('[data-ev]').forEach(i=>i.dispatchEvent(new Event('input',{bubbles:true})));}
});
document.addEventListener('input',e=>{const i=e.target.closest('[data-ev]');if(!i)return;const ve=i.closest('[data-ve]');const s=+(ve.dataset.share||50);const m=parseFloat(i.value.replace(',','.'));const out=i.closest('.card').querySelector('[data-evout]');out.innerHTML=(m>0&&isFinite(m))?evOut(s,Math.round(m*10)):`<p class="small muted" style="margin:0">${esc(t('ve.ev.empty'))}</p>`;});
onlySection();if(location.search.includes("qa"))runQA();
</script>
</body>
