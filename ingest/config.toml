# Batch step 1 configuration (Story 1.3a).
#
# The industries step 1 fetches are not listed here: they come from
# seed/coverage.json, the one hand-edited file under seed/ (AD-16). No
# industry code is named in this file or in ingest/src.

[register]
# Overridden by BRREG_API_BASE_URL when that is set.
base_url = "https://data.brreg.no"
# Identifies Peerless to the register on every request.
user_agent = "Peerless student project (IBE160, Hogskolen i Molde)"
# Pause after each key-figures request, in seconds.
request_pause_seconds = 0.15

# Demo company C: a real company in an industry Peerless does not cover, used
# to show the uncovered-industry state (FR-4, UX-DR41). Chosen in Story 1.3a;
# Story 5.4 confirms it and does not choose it again. Step 1 fetches only its
# Enhetsregisteret record and its key figures, never a filed document.
#
# Each criterion from Story 1.3a, with the evidence as checked on 2026-10-11
# against GET /enhetsregisteret/api/enheter/967534579 and
# GET /regnskapsregisteret/regnskap/967534579:
#
# - In an uncovered industry: naeringskode1.kode is that of
#   "Regnskapsføring og bokføring"; no naeringskode2 or naeringskode3.
# - Active AS: organisasjonsform.kode "AS"; konkurs false; underAvvikling
#   false; underTvangsavviklingEllerTvangsopplosning false.
# - A filing for the latest filing year: SELSKAP filing id 6430011,
#   regnskapsperiode 2025-01-01 to 2025-12-31 (also 2023 and 2024 on file).
# - smaaForetak true and regnskapsregler regnskapslovenAlminneligRegler
#   (read from regnkapsprinsipper, as the API spells it); valuta NOK;
#   avviklingsregnskap false.
# - Unremarkable, all three API figures defined: sumDriftsinntekter
#   50 392 460 and sumEiendeler 25 541 816, both positive; driftsresultat
#   6 381 720 and sumEgenkapital 11 038 439, both positive; 33 employees.
#   Nothing in the name or figures draws attention away from the state.
# - Not the developer's employer: not Statement AS (979 607 008).
[demo_company_c]
orgnr = "967534579"
navn = "KANTALL AS"

# Withdrawn companies (Story 2.4). A plain `pnpm ingest` asks the register's
# unit endpoint about every stored orgnr absent from the bulk download, and
# deletes the company only on 410 Gone. If more than this share of the
# stored companies is absent from the bulk file, the download is taken to be
# truncated: no unit is asked about, nothing is deleted, the run record names
# the failure and the run exits 1 (D5, Meinich 2026-10-30). A share, not a
# percentage: 0.01 is 1 %; read exactly, never compared as a float.
[withdrawal]
max_absent_share = 0.01

# The two reconciliation rules of Story 2.2 (FR-57, FR-58). Each is set here
# once, with its own key, and never combined with the other. The reasons and
# the measurements behind them are in docs/data-sources-brreg.md,
# "Reconciliation".
[reconciliation]
# Within a document: each of the checks c1-c5 holds when its two sides differ
# by at most this many kroner. Absolute, because the register prints whole
# kroner rounded from øre (a stated sum can be a krone or two off its
# components), while a misread figure is wrong by orders of magnitude.
within_document_bound_kr = 5
# Between sources (document against the key-figures API): a figure agrees when
# |document - API| <= max(between_sources_floor_kr, between_sources_tolerance
# x |API|). The floor admits the same krone rounding; the proportional term,
# 0.001 %, admits a millions reporter's rounding in the API (923609016:
# 1 000 000 on 127 220 000 000 is 0.00079 %) and nothing coarser, so swapped
# digits (911701251) still fail. A decimal string, parsed exactly.
between_sources_floor_kr = 5
between_sources_tolerance = "0.00001"
