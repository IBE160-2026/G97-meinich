# Fixture for tests/test_pins.py: every requirement here but one is not an
# exact pin, and the test must name each of them.
[project]
name = "unpinned-fixture"
version = "0.0.0"
dependencies = [
    "httpx>=0.27",
    "anyio==4.6.0",
    "psycopg[binary]==3.3",
]

[project.optional-dependencies]
fast = ["orjson==3.10.*"]

[dependency-groups]
dev = ["pytest~=9.0", "rich"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
